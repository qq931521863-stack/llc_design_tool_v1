[project]
name = "power-design-toolkit"
version = "9.9.0"
description = "Open-source power electronics CAE toolkit for power-stage design, LLC, PFC, FRA, digital control, C99 code generation and switching verification"
license = {text = "GPL-3.0-only"}
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "matplotlib>=3.7",
    "pandas>=2.0",
    "click>=8.1",
    "rich>=13.0",
    "fpdf2>=2.7",
]

[project.optional-dependencies]
# The default PDF regression reads exported reports; research extras are not required.
dev = ["pytest>=7", "pytest-cov", "mypy", "ruff", "httpx2>=2.12,<3", "pdfplumber>=0.11"]
# Release baseline: newer Qt bindings require native lifecycle qualification.
gui = ["PySide6==6.11.2", "pyqtgraph>=0.13.7"]
web = ["fastapi>=0.141,<1", "uvicorn[standard]>=0.30,<1", "openpyxl>=3.1,<4"]
agent = ["mcp>=2,<3"]

research = ["scikit-learn>=1.4", "threadpoolctl>=3", "xlrd>=2", "pdfplumber>=0.11"]

[project.scripts]
pfc-design = "pfc_design.__main__:cli"
pfc-control-lab = "pfc_design.control_cli:cli"
vienna-control-lab = "pfc_design.vienna_cli:cli"
power-control-codegen = "power_codegen.cli:cli"
power-design-gui = "llc_design.gui.app:run_gui"
power-stage-design = "power_stage_design.__main__:main"
power-design-web = "webapp.app:run"
power-design-mcp = "power_agent.mcp_server:main"
llc-design = "llc_design.__main__:cli"
power-control-tools = "power_control_tools.__main__:cli"
llc-gui = "llc_design.gui.app:run_gui"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["power_stage_design*", "dab_design*", "pfc_design*", "llc_design*", "power_codegen*", "power_control_tools*", "power_sim*", "power_agent*", "webapp*", "backend*", "engineering_data*"]
exclude = ["*.output*", "*.__pycache__*"]

[tool.setuptools.package-data]
"engineering_data" = ["*.json"]
"pfc_design.data" = ["*.json"]
"llc_design.data" = ["*.json", "*.jpg"]
"webapp" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["power_stage_design/tests", "dab_design/tests", "pfc_design/tests", "llc_design/tests", "power_codegen/tests", "power_control_tools/tests", "power_sim/tests", "power_agent/tests", "webapp/tests", "backend/tests"]
addopts = "-q"
