name: build-release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: Agg

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          python -m pip install --upgrade pip
          # Include GUI dependencies so launcher/FRA offscreen smoke tests really run
          # instead of being silently skipped by pytest.importorskip().
          python -m pip install -e ".[dev,web,gui]"

      - name: Run tests
        run: python -m pytest

  build:
    if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            artifact: power-design-tool-macos-arm64
            zip-name: PowerDesignTool-macOS-arm64.zip
            app-dir: dist/PowerDesignTool.app
            app-type: app
          - os: windows-latest
            artifact: power-design-tool-windows-x64
            zip-name: PowerDesignTool-Windows-x64.zip
            app-dir: dist/PowerDesignTool
            app-type: exe
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pyinstaller
          python -m pip install -e ".[gui,dev,web]"

      - name: Run tests
        run: python -m pytest

      - name: Build with PyInstaller
        run: |
          python -m PyInstaller --noconfirm --clean --windowed --name PowerDesignTool \
            --collect-data llc_design --collect-data pfc_design --collect-data power_codegen \
            --collect-submodules llc_design --collect-submodules pfc_design --collect-submodules power_codegen \
            --collect-submodules power_control_tools \
            packaging/launcher.py
        shell: bash

      - name: Smoke test (import check on packaged app)
        run: ls -la "${{ matrix.app-dir }}"
        shell: bash

      - name: Zip macOS app
        if: runner.os == 'macOS'
        run: ditto -c -k --sequesterRsrc dist/PowerDesignTool.app "${{ matrix.zip-name }}"

      - name: Zip Windows build
        if: runner.os == 'Windows'
        run: powershell Compress-Archive -Path dist/PowerDesignTool -DestinationPath "${{ matrix.zip-name }}" -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.zip-name }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.zip-name }}
          generate_release_notes: true
          body: |
            Power Design Toolkit V9.2.1 双平台安装包（自动构建）

            ## 本版重点：补齐帮助与实现说明
            - 四个工作区（LLC / PFC / Control Tools / FRA Loop Designer）工具栏新增 **帮助**，
              **F1** 随时打开；功能选择页也有「使用说明 / 帮助 (F1)」
            - 帮助内容随程序分发，每个工作区包含：快速上手、页面与参数说明、
              **实现说明**、模型边界与已知限制、快捷键、联系方式与支持、打开文档
            - 新增 **实现说明**：算法与系数约定到底怎么算的 ——
              FHA/HB/TD 的求解方式、数字环混合域求值与延时拆分、
              采样链「ADC/SOC 归采样块、计算与 PWM 更新归固件块」不重复计数、
              Tustin/预畸变/后向欧拉映射公式、C99 DF2T/SOS 递推式与系数符号、
              极点半径稳定性阈值、FRA 剥离与代数重建、变量投影有理拟合、
              ZOH 闭环与 z⁻¹/z 系数对齐、Auto Design 先相位后增益的流程
            - 新增 **联系与支持**（README + 每个工作区帮助）：
              邮箱 maileyang@qq.com、微信 maileyang、
              公众号/技术博客「开关电源仿真与实用设计」（帮助内附二维码）；
              并写明“有不懂的直接发邮件”以及邮件建议附上的信息

            ## V9.2.0 主要功能（本版同样包含）
            - FRA Loop Designer 独立工作区：Bode100 / SIMPLIS / 通用频响导入，
              Plant TS 与 Complete Loop TS 两种语义（只剥离当前控制器）
            - 目标 Fc/PM 的 Auto Design 与低阶有理模型辨识（≤5 极点，可选纯延时）
            - **辨识被控对象模型 × 控制器打通**：回传为 Plant Source 后可与控制器库
              任意类型组成开环，输出 Bode、PM/GM、S/T 与闭环 Step
            - FRA Loop Designer 控制器类型与 Control Tools 完全配齐
              （14 种结构 + Type-II/III 的 R/C 输入 + Custom H(z) 精确系数入口）
            - 阶跃门控统一：两条 Step 路径共用带宽覆盖判据
              (Fc/Fmin ≥ 10、Fmax/Fc ≥ 5)，置信度 LOW / 含 RHP 极点 / 裕度 FAIL /
              闭环不稳定时一律不给 Step 并说明原因

            ## 完整说明
            使用方式、实现说明、Step 授权边界、已声明假设与已知限制：
            [V9.2.1 发布说明](https://github.com/yangshuai2022-star/llc_design_tool_v1/blob/v9.2.1/DC/release_v9.2.1.md)
            [V9.2.0 发布说明](https://github.com/yangshuai2022-star/llc_design_tool_v1/blob/v9.2.0/DC/release_v9.2.0.md)

            ## 主要功能
            - LLC 谐振腔、Q/ZVS、磁件、损耗、波形、FHA/HB/时域多精度分析与数字电压环设计
            - 单相 TTPL PFC 与三相 Vienna PFC 控制、Bode、AC 周期与开关波形、PF/THD 分析
            - 数字控制工具：控制器/滤波器设计、Bode、Step/Impulse、P/Z、SOS 与单文件 C99 float32_t 导出
            - FRA Loop Designer：实测频响整定、自动设计、模型辨识与辨识模型 × 控制器闭环分析
            - LLC / TTPL / Vienna 平台无关 C99/Float32 控制代码生成

            ## 联系方式
            - 邮箱 maileyang@qq.com（有问题欢迎直接发邮件讨论）
            - 微信 maileyang
            - 公众号 / 技术博客：开关电源仿真与实用设计

            ## Windows 11
            1. 解压 `PowerDesignTool-Windows-x64.zip`
            2. 双击 `PowerDesignTool.exe` 即可运行

            ## macOS (Apple Silicon)
            1. 解压 `PowerDesignTool-macOS-arm64.zip`
            2. 若提示 "Apple 无法验证" / "已损坏":
               - 终端执行 `xattr -cr /Applications/PowerDesignTool.app`
               - 或右键点击 `PowerDesignTool.app` 选 "打开" → 再点 "打开"
            3. 双击 `PowerDesignTool.app` 启动

            ## 使用
            - 启动后选择 LLC / PFC / Control Tools / FRA Loop Designer 工作区；
              任意工作区按 **F1** 查看帮助（含实现说明与模型边界）
            - 单相 PFC CLI：`pfc-control-lab --output output/ttpl`
            - Vienna CLI：`vienna-control-lab --output output/vienna`
            - C99 代码生成：`python -m power_codegen --help`
