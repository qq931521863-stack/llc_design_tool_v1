name: ngspice-smoke

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  spice-smoke:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install ngspice and test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ngspice libngspice0 libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0
          ngspice --version
          ldconfig -p | grep -i ngspice || true
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev,gui]"

      - name: Run simulator and signed PFC producer/consumer checks
        run: |
          python -m pytest power_sim/tests pfc_design/tests/test_psd_switched_cycle.py pfc_design/tests/test_psd_switched_gui.py -q
